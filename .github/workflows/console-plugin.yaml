name: Console Plugin

on:
  pull_request:
    branches:
      - master
      - 'v**'
    paths:
      - 'console-plugin/**'
      - '.github/workflows/console-plugin.yaml'

# Default to no GITHUB_TOKEN permissions; each job opts into the minimum it needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    name: Build and test
    defaults:
      run:
        working-directory: console-plugin
    steps:
    - name: Check out code
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      with:
        ref: ${{github.event.pull_request.head.sha}}

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: console-plugin/package-lock.json

    - name: Install dependencies
      run: npm ci --no-audit --no-fund

    - name: Type check
      run: npm run typecheck

    - name: Test
      run: npm test

    - name: Build
      run: npm run build
