apiVersion: v1
kind: Service
metadata:
  name: reloader-console-plugin
  labels:
    app.kubernetes.io/name: reloader-console-plugin
  annotations:
    # The OpenShift service CA issues the TLS certificate the console uses to reach the plugin.
    service.beta.openshift.io/serving-cert-secret-name: reloader-console-plugin-cert
spec:
  ports:
    - name: https
      port: 9443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: reloader-console-plugin
