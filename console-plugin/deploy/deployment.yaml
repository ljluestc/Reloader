apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-console-plugin
  labels:
    app.kubernetes.io/name: reloader-console-plugin
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: reloader-console-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reloader-console-plugin
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reloader-console-plugin
          image: reloader-console-plugin
          ports:
            - containerPort: 9443
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
          volumeMounts:
            - name: serving-cert
              readOnly: true
              mountPath: /var/cert
            - name: nginx-conf
              readOnly: true
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: serving-cert
          secret:
            secretName: reloader-console-plugin-cert
            defaultMode: 420
        - name: nginx-conf
          configMap:
            name: reloader-console-plugin
            defaultMode: 420
